name: Look Immo CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend-checks:
    name: Backend CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Look-Immo-API/package-lock.json'

      - name: Install Dependencies
        run: |
          cd Look-Immo-API
          npm ci

      - name: Generate Prisma Client
        run: |
          cd Look-Immo-API
          npx prisma generate

      - name: Run ESLint
        run: |
          cd Look-Immo-API
          npm run lint

      - name: Run Typecheck
        run: |
          cd Look-Immo-API
          npm run typecheck

      - name: Run Tests
        run: |
          cd Look-Immo-API
          npm run test

      - name: Run Production Build
        run: |
          cd Look-Immo-API
          npm run build

  frontend-checks:
    name: Frontend CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Look-Immo-Front/package-lock.json'

      - name: Install Dependencies
        run: |
          cd Look-Immo-Front
          npm ci

      - name: Run ESLint
        run: |
          cd Look-Immo-Front
          npm run lint

      - name: Run Typecheck
        run: |
          cd Look-Immo-Front
          npm run typecheck

      - name: Check Circular Imports
        run: |
          cd Look-Immo-Front
          npm run check:circular

      - name: Run Tests
        run: |
          cd Look-Immo-Front
          npm run test

      - name: Run Production Build
        run: |
          cd Look-Immo-Front
          npm run build

  deploy:
    name: Continuous Deployment (Docker Compose)
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    steps:
      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Docker deployment on branch: ${{ github.ref_name }}..."

            # ── 1. Pull latest code ────────────────────────────────────────────
            cd /var/www/LOOK-IMMO.TN
            git fetch --all
            # Force the server to match the remote exactly.
            # Discards any local modifications (e.g. previously-generated prisma
            # client files from the old PM2 deploy) so git never conflicts.
            git reset --hard origin/${{ github.ref_name }}

            # ── 2. Rebuild containers (no layer cache = always picks up changes)
            # Only backend & frontend are rebuilt; db and redis keep running.
            echo "🔨 Building backend and frontend images..."
            docker compose build --no-cache backend frontend

            # ── 3. Recreate only the rebuilt containers with zero data loss ────
            # --force-recreate ensures the new image is used even if the config
            # didn't change. db/redis are untouched.
            echo "♻️  Recreating backend and frontend containers..."
            docker compose up -d --force-recreate --no-deps backend frontend

            # ── 4. Wait for backend health (migrations run inside CMD) ─────────
            # The Dockerfile CMD runs: npx prisma migrate deploy && node dist/index.js
            # so migrations are applied automatically before the server starts.
            echo "⏳ Waiting for backend to become healthy..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' look-immo-backend 2>/dev/null || echo "starting")
              echo "  Attempt $i/30 — status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Backend is healthy!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "❌ Backend did not become healthy in time. Printing logs..."
                docker compose logs --tail=50 backend
                exit 1
              fi
              sleep 3
            done

            # ── 5. Verify frontend is running ──────────────────────────────────
            docker compose ps frontend

            echo "✅ Deployment finished successfully!"
